<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS DevOps CI/CD Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 DevOps CI/CD Live Success!</h1>
        <p>This Python Flask web application is containerized with <strong>Docker</strong>, orchestrated via <strong>AWS EC2</strong>, and deployed automatically using <strong>GitHub Actions & Terraform</strong>.</p>
        <div class="badge">100% FREE TIER COMPLIANT</div>
    </div>
</body>
</html>
