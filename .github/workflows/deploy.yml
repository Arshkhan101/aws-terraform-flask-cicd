name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aws-flask-app:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Pull latest image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/aws-flask-app:latest
            
            # 2. Stop and remove old container if running
            docker stop flask-container || true
            docker rm flask-container || true
            
            # 3. Run new container mapping port 80 to Flask's port 5000
            docker run -d -p 80:5000 --name flask-container ${{ secrets.DOCKER_USERNAME }}/aws-flask-app:latest